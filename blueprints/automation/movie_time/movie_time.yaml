blueprint:
  name: Movie Time v1.4 - TV Lighting Preset
  description: >
    Sets lighting for watching TV: two selected lights are set to specific
    brightness percentages, with the option to turn off a third light.

    Run it directly from Home Assistant by running the automation manually or by
    turning on the selected trigger helper from a dashboard. To trigger it with
    Alexa, expose the same input_boolean helper to Alexa and create an Alexa
    routine for the phrase "Alexa, it's movie time" that turns the helper on.

    After Movie Time runs, the helper is turned back off so the Home Assistant
    control and Alexa phrase can be used again.

  domain: automation
  author: chatgpt
  source_url: >-
    https://github.com/rschwarzjr/home-assistant-blueprints/blob/main/blueprints/automation/movie_time/movie_time.yaml

  homeassistant:
    min_version: "2024.6.0"

  input:
    movie_time_trigger:
      name: Movie Time trigger helper
      description: >
        Input boolean helper used to start Movie Time from Home Assistant or
        Alexa. Expose this helper to Alexa, then create an Alexa routine for
        "Alexa, it's movie time" that turns it on.
      selector:
        entity:
          domain: input_boolean

    lights_to_dim:
      name: Lights to set
      icon: mdi:television-ambient-light
      input:
        light_one:
          name: "Light #1"
          selector:
            entity:
              domain: light

        light_one_brightness:
          name: "Light #1 brightness"
          description: "Brightness percentage for Light #1."
          default: 30
          selector:
            number:
              min: 1
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"

        light_two:
          name: "Light #2"
          selector:
            entity:
              domain: light

        light_two_brightness:
          name: "Light #2 brightness"
          description: "Brightness percentage for Light #2."
          default: 30
          selector:
            number:
              min: 1
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"

    light_to_turn_off:
      name: Optional light to turn OFF
      icon: mdi:lightbulb-off
      input:
        off_light:
          name: Light to turn OFF
          description: Leave empty if no light should be turned off.
          default:
          selector:
            entity:
              domain: light

    options:
      name: Options
      icon: mdi:tune
      input:
        transition_seconds:
          name: Transition
          description: Optional fade duration when changing lights, if supported.
          default: 0
          selector:
            number:
              min: 0
              max: 60
              step: 1
              mode: slider
              unit_of_measurement: seconds

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input movie_time_trigger
    to: "on"

condition: []

action:
  - alias: "Reset Movie Time trigger helper"
    service: input_boolean.turn_off
    target:
      entity_id: !input movie_time_trigger

  - alias: "Turn off optional light"
    if:
      - condition: template
        value_template: >-
          {{ off_light_entity is string and off_light_entity | length > 0 }}
    then:
      - service: light.turn_off
        target:
          entity_id: "{{ off_light_entity }}"
        data:
          transition: !input transition_seconds

  - alias: "Set Light #1 brightness"
    service: light.turn_on
    target:
      entity_id: !input light_one
    data:
      brightness_pct: !input light_one_brightness
      transition: !input transition_seconds

  - alias: "Set Light #2 brightness"
    service: light.turn_on
    target:
      entity_id: !input light_two
    data:
      brightness_pct: !input light_two_brightness
      transition: !input transition_seconds

variables:
  off_light_entity: !input off_light
