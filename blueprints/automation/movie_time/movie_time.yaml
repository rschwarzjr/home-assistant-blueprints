blueprint:
  name: Movie Time v1.1 — TV Lighting Preset
  description: >
    Sets lighting for watching TV: two selected lights are set to specific
    brightness percentages and a third selected light is turned off. This
    automation can be run manually from Home Assistant, or triggered by Alexa
    through an input_boolean helper.

    Alexa setup:
      1. Create a Toggle helper in Home Assistant, such as "Movie Time Trigger".
      2. Select that helper under "Alexa Trigger Switch / input_boolean helper".
      3. Expose the helper to Alexa if needed.
      4. In the Alexa app, create a routine for the phrase "Alexa, it's movie time"
         that turns the helper on.
      5. After this automation runs, it turns the helper back off so the phrase can
         be used again.

    Brightness uses brightness_pct and accepts 1-100. Use the "Light to turn OFF"
    input for any light that should be off instead of setting brightness to 0.

  domain: automation
  source_url: https://github.com/rschwarzjr/home-assistant-blueprints/blob/main/blueprints/automation/movie_time/movie_time.yaml

  input:
    alexa_trigger_switch:
      name: Alexa Trigger Switch / input_boolean helper
      description: >
        Toggle helper that Alexa turns on to run Movie Time. The automation resets
        this helper back off after it runs.
      selector:
        entity:
          domain: input_boolean

    light_one:
      name: Light #1
      selector:
        entity:
          domain: light

    light_one_brightness:
      name: Light #1 brightness percentage
      default: 30
      selector:
        number:
          min: 1
          max: 100
          mode: slider
          step: 1
          unit_of_measurement: "%"

    light_two:
      name: Light #2
      selector:
        entity:
          domain: light

    light_two_brightness:
      name: Light #2 brightness percentage
      default: 30
      selector:
        number:
          min: 1
          max: 100
          mode: slider
          step: 1
          unit_of_measurement: "%"

    light_to_turn_off:
      name: Light to turn OFF
      selector:
        entity:
          domain: light

    transition_seconds:
      name: Optional transition seconds
      description: Fade duration when setting brightness, if supported by the lights.
      default: 0
      selector:
        number:
          min: 0
          max: 30
          step: 1
          mode: slider
          unit_of_measurement: seconds

mode: single
max_exceeded: silent

trigger:
  - platform: state
    id: alexa_helper_on
    entity_id: !input alexa_trigger_switch
    from: "off"
    to: "on"

condition: []

action:
  - alias: "Turn off third light"
    service: light.turn_off
    target:
      entity_id: !input light_to_turn_off

  - alias: "Set Light #1 brightness"
    service: light.turn_on
    target:
      entity_id: !input light_one
    data:
      brightness_pct: !input light_one_brightness
      transition: !input transition_seconds

  - alias: "Set Light #2 brightness"
    service: light.turn_on
    target:
      entity_id: !input light_two
    data:
      brightness_pct: !input light_two_brightness
      transition: !input transition_seconds

  - alias: "Reset Alexa helper switch"
    service: input_boolean.turn_off
    target:
      entity_id: !input alexa_trigger_switch
